<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events — CS&IT KL University</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/design-system.css"/>
  
  <style>
    /* Mobile table scroll */
    .data-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    /* Bottom padding for Apply Now fixed bar */
    @media(max-width:576px){ body { padding-bottom: 48px; } }
    /* Prevent horizontal overflow */
    body { overflow-x: hidden; }
    img { max-width: 100%; height: auto; }
    /* Responsive iframes (organogram, etc.) */
    iframe { max-width: 100%; }
  </style>
</head>
<body data-page="events">
<div id="site-nav"></div>

<div class="page-banner">
  <div class="container">
    <div class="page-banner-title">News & Events</div>
    <div class="page-banner-crumb"><a href="index.html" style="color:#D4A017;font-weight:600;">Home</a> &rsaquo; Events</div>
  </div>
</div>

<div class="page-content">
  <div class="container">
    <div class="content-grid">
      <div class="sidebar">
        <div class="sidebar-title">Events</div>
        <ul><li><a href="events.html" class="active">All Events</a></li></ul>
        
      </div>
      <div class="content-area">
        
    <h2>News &amp; Events</h2>
    <div id="eventsContainer"><p style="color:#999;text-align:center;padding:20px;">Loading...</p></div>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script>
document.addEventListener("DOMContentLoaded",function(){
  const events = DB.get("events")||[];
  const el = document.getElementById("eventsContainer");
  if(!events.length){el.innerHTML='<p style="color:#999;text-align:center;padding:20px;">No events yet. Add via Admin Panel.</p>';return;}
  const today = new Date(); today.setHours(0,0,0,0);
  const sorted=[...events].sort((a,b)=>{
    const da=new Date(a.date), db=new Date(b.date);
    const fa=da>=today, fb=db>=today;
    if(fa&&fb) return da-db;
    if(!fa&&!fb) return db-da;
    return fa?-1:1;
  });
  el.innerHTML=sorted.map(ev=>{
    const d=new Date(ev.date);
    return `<div class="event-item">
      <div class="event-date-box"><div class="eday">${d.getDate()}</div>${d.toLocaleString("en",{month:"short"}).toUpperCase()}</div>
      <div class="event-info"><h5>${ev.title}</h5><p>${ev.desc}</p><span class="event-type-tag">${ev.type}</span><small style="color:#999;font-size:11px;display:block;margin-top:4px;">${d.toLocaleDateString("en-IN",{year:"numeric",month:"long",day:"numeric"})}</small></div>
     
    </div>`;
  }).join("");
});
function deleteEvent(id){if(confirm("Delete this event?")){DB.remove("events",id);location.reload();}}
</script>
</body>
</html>
